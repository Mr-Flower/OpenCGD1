name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENCGD1_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OPENCGD1_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test, lint e build
        env:
          OPENCGD1_STORE_PASSWORD: ${{ secrets.OPENCGD1_STORE_PASSWORD }}
          OPENCGD1_KEY_ALIAS: ${{ secrets.OPENCGD1_KEY_ALIAS }}
          OPENCGD1_KEY_PASSWORD: ${{ secrets.OPENCGD1_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: opencgd1-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
